<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Financas"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Controle de Caixa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0800;font-family:Georgia,serif;color:#F5ECD0}
#bg{position:fixed;inset:0;z-index:0;background-image:url(money-bg.jpg);background-size:cover;background-position:center;filter:brightness(0.28) saturate(0.6)}
#ov{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(15,10,0,.5),rgba(0,0,0,.4))}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh}
::-webkit-scrollbar{display:none}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
</style>
</head>
<body>
<div id="bg"></div>
<div id="ov"></div>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px"><div style="font-size:40px">🪙</div><div style="font-size:14px;letter-spacing:3px;font-family:monospace;color:#D4AF37">CARREGANDO...</div></div></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
var G="#D4AF37",GL="#F0D060",GD="#8B7320";
var MO=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
var CE=[{id:"negocio",l:"Negocio",e:"✂️",c:"#D4AF37"},{id:"extra",l:"Renda Extra",e:"💡",c:"#F0D060"},{id:"outros_e",l:"Outros",e:"➕",c:"#BFA030"}];
var CS=[{id:"moradia",l:"Moradia",e:"🏠",c:"#C0392B"},{id:"alimentacao",l:"Alimentacao",e:"🍽️",c:"#E67E22"},{id:"transporte",l:"Transporte",e:"🚗",c:"#D4AF37"},{id:"saude",l:"Saude",e:"❤️",c:"#E91E8C"},{id:"lazer",l:"Lazer",e:"🎮",c:"#9B59B6"},{id:"educacao",l:"Educacao",e:"📚",c:"#2980B9"},{id:"investimento",l:"Invest.",e:"📈",c:"#D4AF37"},{id:"outros_s",l:"Outros",e:"📦",c:"#7F8C8D"}];
var S={tab:"dashboard",mo:new Date().getMonth(),txs:[],sy:false,f:{tp:"saida",cat:"alimentacao",desc:"",val:"",dt:new Date().toISOString().split("T")[0]}};
function gc(tp,id){var l=tp==="entrada"?CE:CS;for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return{id:id,l:id,e:"📦",c:"#888"};}
function fm(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function R(){
  var root=document.getElementById("app");
  var tx=S.txs.filter(function(t){return new Date(t.dt+"T12:00:00").getMonth()===S.mo;});
  tx.sort(function(a,b){return b.dt>a.dt?1:-1;});
  var en=0,sa=0;tx.forEach(function(t){t.tp==="entrada"?en+=t.v:sa+=t.v;});
  var sl=en-sa;
  var cm={};tx.filter(function(t){return t.tp==="saida";}).forEach(function(t){cm[t.cat]=(cm[t.cat]||0)+t.v;});
  var bc=Object.entries(cm).sort(function(a,b){return b[1]-a[1];});
  var mx=bc.length?bc[0][1]:1;
  var h="";
  h+='<div style="padding:44px 20px 16px;background:rgba(10,7,0,.93);border-bottom:1px solid rgba(212,175,55,.25);backdrop-filter:blur(12px)">';
  h+='<div style="text-align:center;margin-bottom:18px"><div style="font-size:10px;letter-spacing:6px;color:'+G+';margin-bottom:4px;font-family:monospace">✦ FINANCAS PESSOAIS ✦</div>';
  h+='<div style="font-size:22px;font-weight:700;background:linear-gradient(135deg,'+GL+','+G+','+GD+');-webkit-background-clip:text;-webkit-text-fill-color:transparent">Controle de Caixa</div></div>';
  h+='<div style="display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px">';
  MO.forEach(function(m,i){var a=S.mo===i;h+='<button onclick="setMo('+i+')" style="min-width:34px;padding:4px 7px;background:'+(a?"linear-gradient(135deg,"+GD+","+G+")"):"rgba(255,255,255,.06)")+';color:'+(a?"#000":"#777")+';border:'+(a?"none":"1px solid rgba(212,175,55,.2)")+';border-radius:20px;font-size:11px;cursor:pointer;font-family:monospace">'+m+'</button>';});
  h+='</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">';
  [{l:"Entradas",v:en,c:G},{l:"Saidas",v:sa,c:"#E74C3C"},{l:"Saldo",v:sl,c:sl>=0?G:"#E74C3C"}].forEach(function(x){h+='<div style="background:'+x.c+'22;border-radius:12px;padding:10px 8px;text-align:center;border:1px solid '+x.c+'33"><div style="font-size:10px;color:#666;margin-bottom:4px;font-family:monospace">'+x.l+'</div><div style="font-size:11px;font-weight:700;color:'+x.c+';font-family:monospace">'+fm(x.v)+'</div></div>';});
  h+='</div></div>';
  h+='<div style="position:fixed;top:12px;right:12px;z-index:100;background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.4);border-radius:20px;padding:4px 12px;font-size:11px;color:'+G+';font-family:monospace">'+(S.sy?"⟳ sync":"☁️ online")+'</div>';
  h+='<div style="display:flex;background:rgba(8,6,0,.93);border-bottom:1px solid rgba(212,175,55,.2);backdrop-filter:blur(12px)">';
  [{id:"dashboard",l:"📊 Visao"},{id:"lancamentos",l:"📋 Lanc."},{id:"add",l:"+ Add"}].forEach(function(tb){h+='<button onclick="setTab(''+tb.id+'')" style="flex:1;padding:12px 4px;background:transparent;border:none;border-bottom:2px solid '+(S.tab===tb.id?G:"transparent")+';color:'+(S.tab===tb.id?G:"#555")+';font-size:12px;cursor:pointer;font-family:inherit">'+tb.l+'</button>';});
  h+='</div><div style="padding:16px 16px 40px">';
  if(S.tab==="dashboard"){
    h+='<div style="background:rgba(8,6,1,.91);border:1px solid rgba(212,175,55,.3);border-radius:14px;padding:16px;margin-bottom:14px;backdrop-filter:blur(14px)"><div style="font-size:11px;color:'+G+';margin-bottom:12px;font-family:monospace;letter-spacing:2px">◆ ONDE FOI O DINHEIRO</div>';
    if(!bc.length)h+='<div style="color:#444;font-size:13px;text-align:center;padding:20px 0">Nenhuma saida registrada</div>';
    bc.forEach(function(e){var cat=gc("saida",e[0]);var pct=Math.round(e[1]/mx*100);h+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:13px">'+cat.e+" "+cat.l+'</span><span style="font-size:13px;color:'+G+';font-family:monospace">'+fm(e[1])+'</span></div><div style="height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,'+GD+','+G+');border-radius:3px"></div></div><div style="font-size:10px;color:#444;text-align:right;margin-top:2px;font-family:monospace">'+Math.round(e[1]/sa*100)+'% do total</div></div>';});
    h+='</div>';
    var gp=sa>0?Math.round(sa/en*100):0;var sp=sl>=0?Math.round(sl/(en||1)*100):0;
    h+='<div style="background:rgba(8,6,1,.91);border:1px solid rgba(212,175,55,.3);border-radius:14px;padding:16px;margin-bottom:14px;backdrop-filter:blur(14px)"><div style="font-size:11px;color:'+G+';margin-bottom:10px;font-family:monospace;letter-spacing:2px">◆ SAUDE FINANCEIRA</div><div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="font-size:13px;color:#999">Voce gastou</span><span style="font-size:14px;font-weight:700;font-family:monospace;color:'+(gp>80?"#E74C3C":G)+'">'+gp+'% da renda</span></div><div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="font-size:13px;color:#999">Sobrou</span><span style="font-size:14px;font-weight:700;font-family:monospace;color:'+G+'">'+sp+'% guardado</span></div><div style="padding:10px 12px;border-radius:8px;background:'+(sl>=0?"rgba(212,175,55,.1)":"rgba(231,76,60,.1)")+';border:1px solid '+(sl>=0?G+"44":"#E74C3C44")+';font-size:12px;color:'+(sl>=0?GL:"#E74C3C")+'">'+(sl>=0?"✦ Bom trabalho! Tem "+fm(sl)+" disponivel.":"⚠️ Saidas superam entradas em "+fm(Math.abs(sl))+".")+'</div></div>';
    h+='<div style="background:rgba(6,4,14,.9);border:1px solid rgba(212,175,55,.15);border-radius:14px;padding:14px"><div style="font-size:11px;color:'+GL+';margin-bottom:6px;font-family:monospace;letter-spacing:2px">💡 DICA</div><p style="font-size:12px;color:#888;line-height:1.7">Guarde <strong style="color:#F5ECD0">20-30%</strong> antes de pagar contas.</p></div>';
  }
  if(S.tab==="lancamentos"){
    h+='<div style="font-size:11px;color:#555;margin-bottom:12px;font-family:monospace">'+tx.length+' lancamentos em '+MO[S.mo]+'</div>';
    if(!tx.length)h+='<div style="text-align:center;color:#555;padding:40px 0;font-size:13px">Nenhum lancamento.<br><span style="color:'+G+';cursor:pointer" onclick="setTab('add')">+ Adicionar</span></div>';
    tx.forEach(function(t){var cat=gc(t.tp,t.cat);h+='<div style="display:flex;align-items:center;gap:12px;background:rgba(8,6,1,.91);border:1px solid rgba(212,175,55,.3);border-left:3px solid '+(t.tp==="entrada"?G:"#E74C3C")+';border-radius:12px;padding:12px 14px;margin-bottom:8px;backdrop-filter:blur(14px)"><span style="font-size:22px">'+cat.e+'</span><div style="flex:1"><div style="font-size:13px">'+t.desc+'</div><div style="font-size:11px;color:#555;font-family:monospace">'+cat.l+" · "+new Date(t.dt+"T12:00:00").toLocaleDateString("pt-BR")+'</div></div><div style="text-align:right"><div style="font-size:14px;font-weight:700;font-family:monospace;color:'+(t.tp==="entrada"?G:"#E74C3C")+'">'+(t.tp==="entrada"?"+":"-")+fm(t.v)+'</div><button onclick="rmTx(''+t.id+'')" style="background:none;border:none;color:#444;cursor:pointer;font-size:11px">remover</button></div></div>';});
  }
  if(S.tab==="add"){
    var cats=S.f.tp==="entrada"?CE:CS;
    h+='<div style="font-size:11px;color:'+G+';margin-bottom:16px;font-family:monospace;letter-spacing:2px">◆ NOVO LANCAMENTO</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">';
    [{val:"entrada",l:"💰 Entrada",c:G},{val:"saida",l:"💸 Saida",c:"#E74C3C"}].forEach(function(o){h+='<button onclick="setFTp(''+o.val+'')" style="padding:12px;background:'+(S.f.tp===o.val?o.c+"22":"rgba(255,255,255,.05)")+';border:2px solid '+(S.f.tp===o.val?o.c:"rgba(212,175,55,.15)")+';border-radius:10px;color:'+(S.f.tp===o.val?o.c:"#555")+';font-size:14px;cursor:pointer;font-family:inherit">'+o.l+'</button>';});
    h+='</div><div style="margin-bottom:14px"><div style="font-size:11px;color:#555;margin-bottom:8px;font-family:monospace">CATEGORIA</div><div style="display:flex;flex-wrap:wrap;gap:4px">';
    cats.forEach(function(c){var a=S.f.cat===c.id;h+='<button onclick="setFCat(''+c.id+'')" style="padding:5px 10px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;background:'+(a?c.c+"22":"rgba(255,255,255,.05)")+';border:1px solid '+(a?c.c:"rgba(212,175,55,.15)")+';color:'+(a?c.c:"#666")+'">'+c.e+" "+c.l+'</button>';});
    h+='</div></div><div style="margin-bottom:14px"><div style="font-size:11px;color:#555;margin-bottom:6px;font-family:monospace">DESCRICAO</div><input type="text" placeholder="Ex: Supermercado" value="'+S.f.desc+'" oninput="S.f.desc=this.value" style="width:100%;padding:12px 14px;background:rgba(12,9,2,.92);border:1px solid rgba(212,175,55,.25);border-radius:10px;color:#F5ECD0;font-size:14px;font-family:inherit;outline:none"></div><div style="margin-bottom:14px"><div style="font-size:11px;color:#555;margin-bottom:6px;font-family:monospace">VALOR (R$)</div><input type="number" placeholder="0,00" value="'+S.f.val+'" oninput="S.f.val=this.value" style="width:100%;padding:12px 14px;background:rgba(12,9,2,.92);border:1px solid rgba(212,175,55,.25);border-radius:10px;color:#F5ECD0;font-size:14px;font-family:inherit;outline:none"></div><div style="margin-bottom:14px"><div style="font-size:11px;color:#555;margin-bottom:6px;font-family:monospace">DATA</div><input type="date" value="'+S.f.dt+'" oninput="S.f.dt=this.value" style="width:100%;padding:12px 14px;background:rgba(12,9,2,.92);border:1px solid rgba(212,175,55,.25);border-radius:10px;color:#F5ECD0;font-size:14px;font-family:inherit;outline:none"></div>';
    h+='<button onclick="addTx()" style="width:100%;padding:14px;background:'+(S.f.tp==="entrada"?"linear-gradient(135deg,"+GD+","+G+")":"linear-gradient(135deg,#7F1D1D,#E74C3C)")+';border:none;border-radius:12px;color:'+(S.f.tp==="entrada"?"#000":"#fff")+';font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:1px">'+(S.sy?"Salvando...":S.f.tp==="entrada"?"✦ Registrar Entrada":"✦ Registrar Saida")+'</button>';
  }
  h+='</div>';
  root.innerHTML=h;
}
function setTab(t){S.tab=t;R();}
function setMo(m){S.mo=m;R();}
function setFTp(t){S.f.tp=t;S.f.cat=t==="entrada"?"negocio":"alimentacao";R();}
function setFCat(c){S.f.cat=c;R();}
function addTx(){
  if(!S.f.desc||!S.f.val||!S.f.dt)return;
  S.sy=true;R();
  window.db.collection("lancamentos").add({tp:S.f.tp,cat:S.f.cat,desc:S.f.desc,v:parseFloat(S.f.val),dt:S.f.dt})
  .then(function(){S.f.desc="";S.f.val="";S.tab="dashboard";S.sy=false;R();})
  .catch(function(e){console.error(e);S.sy=false;R();});
}
function rmTx(id){window.db.collection("lancamentos").doc(id).delete();}
firebase.initializeApp({apiKey:"AIzaSyBXxjHAmRol8vjR_9R_QKRQhEfmjfY_j6M",authDomain:"financas-app-1f0e2.firebaseapp.com",projectId:"financas-app-1f0e2",storageBucket:"financas-app-1f0e2.firebasestorage.app",messagingSenderId:"232492020551",appId:"1:232492020551:web:705005c954d90962eb9262"});
window.db=firebase.firestore();
window.db.collection("lancamentos").onSnapshot(function(snap){
  S.txs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
  R();
},function(e){console.error(e);R();});
</script>
</body>
</html>
